name: Staging RLS Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-proof:
    name: Cross-tenant refusal proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Require staging credentials
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing"
              missing=1
            fi
          done
          exit "$missing"
      - name: Refuse non-staging target
        shell: bash
        run: |
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *ngvxfkmmhkgrlnsgixle*) ;;
            *) echo "::error::Supabase URL is not Obsidian Staging"; exit 1 ;;
          esac
      - name: Run cross-tenant RLS proof
        run: node scripts/rls-cross-tenant-proof.mjs
